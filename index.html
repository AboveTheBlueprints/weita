}

// 第 14 天 11:09 第二个：打点（梓韬 11:08："你做个打点吧……我玩的时候你就可以看得到我的行动轨迹了"）。
// 每按一下记 键@离上一下几秒；Z 撤、R 重来、开 进这一张、死/过/黑 一局的结果。攒 8 下或一局结束就发到 ntfy.sh 的一个话题（公开服务，只发按键，不发别的）。
// 规矩是定死的，有按键就能在 sim 里一步步重放出整局。网址后面加 ?nodian 就不发（录像用）。
const DIAN = { id: Math.random().toString(36).slice(2, 6), buf: [], t: Date.now(), ju: [], off: /nodian/.test(location.search) };
function dian(e) {
  if (DIAN.off) return;
  DIAN.buf.push(e + '@' + ((Date.now() - DIAN.t) / 1000).toFixed(1)); DIAN.t = Date.now();
  if (DIAN.buf.length >= 8 || /^(死|过|黑|开|重来)/.test(e)) dianSend();
}
function dianSend() {
  if (DIAN.off || !DIAN.buf.length) return;
  const body = `${DIAN.id} 第${li + 1}张${LEVELS[li].name} 第${DIAN.ju[li] || 1}局 ` + DIAN.buf.join(' ');
  DIAN.buf = [];
  try { fetch('https://ntfy.sh/weita-dian-7f3k9q', { method: 'POST', body, keepalive: true }); } catch (e) {}
}
addEventListener('pagehide', dianSend);

function start(i) {
  DIAN.ju[i] = (DIAN.ju[i] || 0) + 1;
  li = i; const L = LEVELS[i];
  // 第二个·页11 20:15 页29换缝：石缝那张每次重来换一回哪几道缝有虫（照重来的次数挑，同一串键重放出来一样）。第一局是原图。
  // 为什么：网页上的人第一局挨个踩，记住哪几道有虫，第二局直接去，用不着看它；每局都不变的只剩它的脾气（饿了去扒有虫的缝）。
  const text = (L.layouts && DIAN.ju[i] > 1) ? L.layouts[(DIAN.ju[i] - 2) % L.layouts.length] : L.text;
  m = new S.Map(text, L.face, L.need, L.carry, L.V);
  if (L.hun0 !== undefined) m.hun0 = L.hun0; if (L.dig0) m.dig0 = true; if (L.grudge0) m.grudge0 = L.grudge0;   // 第二个·页11 21:47 页35骗
  st = S.init(m); prev = null; n = 0; over = false; log = []; deadMark = null; heardNow = false; hist = []; aim = false;
  if (m.dig0 && st.lz.mode === '扒') log = ['蜥蜴蹲在一道石缝上，低头扒着。石缝底下吱吱叫了两声。'];   // 第二个 第 15 天 00:17 页40开局扒
  document.getElementById('intro').textContent = goal();
  const canX = L.V.includes('吐');
  document.getElementById('keys').innerHTML = '红的是蜥蜴，尖的一头是它的脸。灰的那块是它的石头。涂黄的格子是它脸朝着的那一条，一直到墙：你这一步走完还站在黄格里，它就看见你。淡淡的白线是这一回合谁从哪儿动过来。<br>方向键或 WASD 走一格，空格不动' + (canX ? (L.V.includes('吐选') ? '，按 X 再按一个方向，把吃下去的一只虫往那边扔，最远 3 格，碰到墙、虫或蜥蜴就停（这一步你不动）' : '，X 把吃下去的一只虫吐出去（这一步你不动；虚线框那格就是会落的地方）') : '') + `。Z 撤一步，R 从头再来。天黑前（${lim()} 步以内）要回到窝。`;
  document.getElementById('xbtn').style.visibility = canX ? 'visible' : 'hidden';
  document.getElementById('next').style.display = (PASSED.has(li) && li + 1 < LEVELS.length) ? 'inline-block' : 'none';   // 第一个 17:01：过了的张重来、撤回以后'下一张'还在
  document.getElementById('msg').textContent = '';
  document.querySelectorAll('#levels button').forEach((b, j) => b.classList.toggle('on', j === i));
  draw(); dian('开');
}

let heardNow = false;
let aim = false;   // 第二个·页11 17:06：吐选——按 X 进入瞄准，再按方向扔
function aimDrops() { return ['U', 'R', 'D', 'L'].map(d => S.dropAt(m, st, d)).filter(p => p && !eq(p, st.pl)); }
function draw(anim) {
  const info = { prev: anim ? prev : null, st, dead: deadMark, drop: (!over && !deadMark) ? (m.V.has('吐选') ? (aim ? aimDrops() : null) : S.dropAt(m, st)) : null, heard: heardNow, spit: anim && lastDrop && prev ? { from: prev.pl, to: lastDrop } : null };
  const cv = document.getElementById('board');
  if (anim && WeiDraw.animate) WeiDraw.animate(cv, m, info); else (WeiDraw.still || WeiDraw.frame)(cv, m, Object.assign(info, { prev }), 1);
  document.getElementById('status').textContent = `第 ${li + 1} 张　走了 ${n} 步，还剩 ${lim() - n} 步　肚子里 ${st.ate} 只` + (m.V.has('日子') ? `　蜥蜴的肚子：${st.lz.hun >= 5 ? '鼓鼓的' : st.lz.hun >= 1 ? '瘪下去一点了' : '瘪了'}` : '');
  document.getElementById('log').innerHTML = log.map(t => `<div>${t}</div>`).join('');
}

// 10:25 第一个看了 Bunburrows：它能撤一步，人才敢去捅它、看它怎么反应。加 Z 撤一步（被吃了也能撤），规矩一条不动。
let hist = [];
const PASSED = new Set();
function undo() {
  if (!hist.length) return;
  dian('Z');
  const h = hist.pop();
  ({ st, prev, n, over, deadMark, lastDrop, heardNow } = h); log = h.log.slice(); aim = false;
  document.getElementById('msg').textContent = '';
  document.getElementById('next').style.display = (PASSED.has(li) && li + 1 < LEVELS.length) ? 'inline-block' : 'none';   // 第一个 17:01：过了的张重来、撤回以后'下一张'还在
  draw();
}
function act(k) {
  if (over) return;
  if (k === 'X' && m.V.has('吐选')) {
    if (aim) { aim = false; document.getElementById('msg').textContent = ''; draw(); return; }
    if (st.ate < 1) { document.getElementById('msg').textContent = '肚子里没有虫，吐不出来。'; return; }
    aim = true; document.getElementById('msg').textContent = '往哪边扔？按方向键（虚线框是会落的地方；再按 X 不扔了）。'; draw(); return;
  }
  if (aim) { aim = false; if ('URDL'.includes(k) && k.length === 1) k = 'X' + k; else { document.getElementById('msg').textContent = ''; draw(); return; } }
  const L = LEVELS[li];
  if (k[0] === 'X' && !L.V.includes('吐')) { document.getElementById('msg').textContent = '这一张还吐不出来。'; return; }
  const snap = { st, prev, n, over, deadMark, lastDrop, heardNow, log: log.slice() };
  lastDrop = k[0] === 'X' ? S.dropAt(m, st, k[1]) : null;
  const r = S.step(m, st, k);
  const msg = document.getElementById('msg');
  if (r !== 'bad') hist.push(snap);
  if (r === 'bad') {
    msg.textContent = k[0] === 'X' ? '吐不出来：肚子里没有虫，或者脚下已经有一只。' : (st.lz && (() => { const d = S.DIRS[k]; return eq([st.pl[0] + d[0], st.pl[1] + d[1]], st.lz.pos); })() ? '走不过去，蜥蜴占着那一格。' : '走不过去，那边是墙。');
    // 第二个·页11 21:39 页34撞：网4"按了几次才发现没走"，那句字在右上角，眼睛在格子上看不见。走不过去时整块格子往那边顶一下再弹回来。
    if (k[0] !== 'X' && S.DIRS[k]) { const d = S.DIRS[k], cv = document.getElementById('board'); if (cv.animate) cv.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${d[0] * 9}px,${d[1] * 9}px)` }, { transform: 'translate(0,0)' }], { duration: 160, easing: 'ease-out' }); }
    return;
  }
  n += 1; msg.textContent = '';
  if (r === null) {
    const d = S.DIRS[k] || [0, 0];
    deadMark = { at: [st.pl[0] + d[0], st.pl[1] + d[1]], from: st.lz.pos };
    log.unshift(`第 ${n} 步（${KNAME[k]}）：你走完这一步，蜥蜴扑到了你身上。（红叉是它扑到你的那一格）`);
    over = true; msg.textContent = '你被吃掉了。按 Z 撤回一步，或者按 R 从头再来。'; dian(k); dian('死');
    prev = st; heardNow = false; draw(true); return;
  }
  heardNow = S.heard; dian(k);
  const ev = events(k, st, r);   // 09:55 第三个：空着的步把有事的挤下去了，没动静的那步淡淡写一句
  log.unshift(ev.length ? `第 ${n} 步（${KNAME[k]}）：` + ev.join(' ') : `<span style="color:#77735f">第 ${n} 步（${KNAME[k]}）：你走了一格，它没动静。</span>`);
  prev = st; st = r;
  if (st.ate + (st.hid || []).filter(b => b).length < m.need && st.bugs.every(b => !b)) { over = true; msg.textContent = `你肚子里只剩 ${st.ate} 只，地上也没有虫了，凑不够 ${m.need} 只，这一局赢不了了。按 R 从头再来。`; }
  else if (st.ate < m.need && eq(st.pl, m.nest)) { msg.textContent = `到窝了，可肚子里只有 ${st.ate} 只，要带 ${m.need} 只回来。`; }   // 第二个·页11 17:29：七1、七2 带着不够数的虫回窝，屏幕没反应，以为要出去再进来
  else if (st.ate >= m.need && eq(st.pl, m.nest)) {
    over = true; msg.textContent = `回到窝了，过了！一共 ${n} 步。`; dian('过'); PASSED.add(li);
    if (li + 1 < LEVELS.length) document.getElementById('next').style.display = 'inline-block';
    else msg.textContent += ' 天黑了，它也回石头上趴着了。这几张都过完了。';
  } else if (n >= lim()) { over = true; dian('黑'); msg.textContent = `走了 ${lim()} 步还没回窝，天黑了。这一局完了。按 R 从头再来。`; }
  draw(true);
}

const KEYMAP = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R', W: 'U', S: 'D', A: 'L', D: 'R', ' ': '.', '.': '.', x: 'X', X: 'X' };
document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { dian('重来'); start(li); e.preventDefault(); return; }
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') { undo(); e.preventDefault(); return; }
  if (e.key === 'Enter' && document.getElementById('next').style.display !== 'none') { start(li + 1); return; }
  const k = KEYMAP[e.key]; if (k) { act(k); e.preventDefault(); }
});
document.querySelectorAll('#pad button').forEach(b => b.addEventListener('click', () => act(b.dataset.k)));
document.getElementById('again').onclick = () => { dian('重来'); start(li); };
document.getElementById('undo').onclick = () => undo();
document.getElementById('next').onclick = () => start(li + 1);
const lv = document.getElementById('levels');
LEVELS.forEach((L, i) => { const b = document.createElement('button'); b.textContent = (i + 1) + ' ' + L.name; b.onclick = () => start(i); lv.appendChild(b); });
start(0);
</script>
</body>
</html>
