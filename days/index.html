    log.unshift(`第 ${n} 步（${KNAME[k]}）：你走完这一步，${st.lzB ? (S.killedBy === 'B' ? '青蜥蜴' : '红蜥蜴') : '蜥蜴'}扑到了你身上。（红叉是它扑到你的那一格）`);   // 第二个 07:50：两只的时候写是哪只（第三个：分不清是谁压的）
    over = true; msg.textContent = '你被吃掉了。按 Z 撤回一步，或者按 R 从头再来。'; dian(k); dian('死');
    prev = st; heardNow = false; earNow = null; draw(true); return;
  }
  heardNow = S.heard; earNow = [S.ear || null, (S.B && S.B.ear) || null]; dian(k);
  const ev = events2(k, st, r);   // 09:55 第三个：空着的步把有事的挤下去了，没动静的那步淡淡写一句
  log.unshift(ev.length ? `第 ${n} 步（${KNAME[k]}）：` + ev.join(' ') : `<span style="color:#77735f">第 ${n} 步（${KNAME[k]}）：你走了一格，它没动静。</span>`);
  prev = st; st = r;
  if (st.ate + (st.hid || []).filter(b => b).length < m.need && st.bugs.every(b => !b)) { msg.textContent = `你肚子里只剩 ${st.ate} 只，地上也没有虫了，凑不够 ${m.need} 只，今天带不够虫回窝了。可以接着看它，` + (canEndDay() ? '也可以现在就这样过完这一天，或者按 R 从头再来。' : '天黑前随时按 R 从头再来。'); if (canEndDay()) document.getElementById('endday').style.display = 'inline-block'; }   // 第二个 第 16 天 02:05 页93：不当场判输，让人看完它吃那一口（赶7、渣8 都撞上）
  else if (st.ate < m.need && eq(st.pl, m.nest)) { msg.textContent = `到窝了，可肚子里只有 ${st.ate} 只，要带 ${m.need} 只回来。`; }   // 第二个·页11 17:29：七1、七2 带着不够数的虫回窝，屏幕没反应，以为要出去再进来
  else if (st.ate >= m.need && eq(st.pl, m.nest)) {
    over = true; msg.textContent = `回到窝了，过了！一共 ${n} 步。`;
    if (LEVELS[li].day) { const ss = hist.map(h => h.st).concat([st]); let ea = 0; for (let q = 1; q < ss.length; q++) if (ss[q].lz.mode === '吃' && ss[q - 1].lz.mode !== '吃') ea++; const lf = st.bugs.filter(b => b).length; DAYINFO[li] = { left: lf, ate: ea, haunt: st.lz.haunt || null, all: st.bugs.filter(b => b).map(b => b.slice()) /* 第二个 页98：野的也过夜 */, dead: (() => { const D = []; for (let q = 1; q < ss.length; q++) (ss[q - 1].bugs || []).forEach((b, i) => { if (b && !(ss[q].bugs || [])[i]) D.push(b.slice()); }); return D; })() /* 第二个 页98：今天虫在哪几格没了（你吃的、它吃的），明天新来的生在这几格旁边 */, mine: st.bugs.map((b, i) => (b && st.mine && st.mine[i]) ? b.slice() : null).filter(Boolean) }; const CNN = x => x ? ['', '一', '两', '三', '四', '五', '六'][x] : '零'; let eb = 0; if (st.lzB) for (let q = 1; q < ss.length; q++) if (ss[q].lzB && ss[q - 1].lzB && ss[q].lzB.mode === '吃' && ss[q - 1].lzB.mode !== '吃') eb++;   /* 第二个 第 16 天 12:36 页113：两只的天各说各的（整1 第 6 天'它今天吃了零只'，对照日志才知道是红的零只、青的两只） */
      msg.textContent += (st.lzB ? `红的今天吃了${CNN(ea)}只，青的吃了${CNN(eb)}只` : `它今天吃了${CNN(ea)}只`) + `，地上还剩${lf ? ['', '一', '两', '三', '四', '五', '六'][lf] : '零'}只。`; } /* 第二个 17:40 页77几天 */ dian('过'); PASSED.add(li); DAYS[li] = { m, st0: hist.length ? hist[0].st : st, st, R: replayPath() }; CARRY[li] = { a: (() => { const f = st.lz.fed || 0, L0 = LEVELS[li], f0 = L0.from && CARRY[L0.from - 1] ? (CARRY[L0.from - 1].a || 0) : 0; return f > f0 ? f : Math.max(0, f - 1); })(), b: st.lzB ? (st.lzB.fed || 0) : 0, g: st.lz.grudge || null };   // 第二个 09:17 页61记仇隔天：也记着它最后在哪丢的你
    if (li + 1 < LEVELS.length) document.getElementById('next').style.display = 'inline-block';
    else if (LEVELS[li].day) msg.innerHTML += ` 七天过完了。<a href="?seed=${SEED + 1}" style="color:#d9b44a">换一块地再过七天</a>`;
    else msg.textContent += ' 天黑了，它也回石头上趴着了。这几张都过完了。';
    if (li + 1 >= LEVELS.length) document.getElementById('days').style.display = 'inline-block';   // 第二个 12:31 页71它的日子
  } else if (n >= lim()) { over = true; dian('黑'); if (!LEVELS[li].day) msg.textContent = `走了 ${lim()} 步还没回窝，天黑了。这一局完了。按 R 从头再来。`; else if (canEndDay()) { msg.textContent = `走了 ${lim()} 步，天黑了，你没带够虫回窝，今晚空着肚子。可以就这样过完这一天，也可以按 R 从头再来。`; document.getElementById('endday').style.display = 'inline-block'; } else msg.textContent = `走了 ${lim()} 步，天黑了，你没带够虫回窝。昨天你也是空着肚子回的窝，连着两天，熬不过这一夜。按 R 从头再来这一天。`; }
  draw(true);
}

const KEYMAP = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R', W: 'U', S: 'D', A: 'L', D: 'R', ' ': '.', '.': '.', x: 'X', X: 'X' };
document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { dian('重来'); start(li); e.preventDefault(); return; }
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') { undo(); e.preventDefault(); return; }
  if ((e.key === 'n' || e.key === 'N') && document.getElementById('endday').style.display !== 'none') { endDay(); e.preventDefault(); return; }   // 第二个 页115
  if (e.key === 'Enter' && document.getElementById('next').style.display !== 'none') { start(li + 1); e.preventDefault(); return; }   // 第二个 第 15 天 04:36：整十一1 点过张名以后，那颗按钮留着焦点，回车同时'点'了它，又回到本张开头
  const k = KEYMAP[e.key]; if (k) { act(k); e.preventDefault(); }
});
document.querySelectorAll('#pad button').forEach(b => b.addEventListener('click', () => act(b.dataset.k)));
document.getElementById('again').onclick = () => { dian('重来'); start(li); };
document.getElementById('days').onclick = showDays;   // 第二个 12:31 页71它的日子
document.getElementById('undo').onclick = () => undo();
document.getElementById('next').onclick = () => start(li + 1);
document.getElementById('endday').onclick = () => endDay();   // 第二个 页115
const lv = document.getElementById('levels');
LEVELS.forEach((L, i) => { const b = document.createElement('button'); b.textContent = (i + 1) + ' ' + L.name; b.onclick = () => { start(i); b.blur(); }; lv.appendChild(b); });
start(0);
</script>
</body>
